name: gitea
title: Gitea
icon: gitea
docs: https://wodby.com/docs/2.0/stacks/catalog/gitea/

services:
- name: gitea
  title: Gitea
  service: gitea
  required: true
  main: true
  links:
  - name: postgres
    service: postgres
  - name: sendmail
    service: opensmtpd

- name: postgres
  title: PostgreSQL
  service: postgres
  required: true
  volumes:
  - name: data
    size: 20

- name: opensmtpd
  title: OpenSMTPD
  service: opensmtpd
